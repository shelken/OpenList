---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build Custom Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (e.g. v4.2.9-patch.1)"
        required: true
        default: "v4.2.9-patch.1"
      as_latest:
        description: "Tag as latest?"
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/openlist,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          DIGEST="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Manifests
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          TAG_ARGS="-t ghcr.io/${{ github.repository_owner }}/openlist:${{ inputs.image_tag }}"
          if [ "${{ inputs.as_latest }}" = "true" ]; then
            TAG_ARGS="${TAG_ARGS} -t ghcr.io/${{ github.repository_owner }}/openlist:latest"
          fi
          docker buildx imagetools create ${TAG_ARGS} $(printf 'ghcr.io/${{ github.repository_owner }}/openlist@sha256:%s ' *)

      - name: Inspect and output digest
        run: |
          DIGEST=$(docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/openlist:${{ inputs.image_tag }} --format '{{ json . }}' | jq -r '.manifest.digest')
          echo "IMAGE_DIGEST=${DIGEST}" >> $GITHUB_ENV
          echo "### 镜像发布成功" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`ghcr.io/${{ github.repository_owner }}/openlist:${{ inputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: \`${DIGEST}\`" >> $GITHUB_STEP_SUMMARY
